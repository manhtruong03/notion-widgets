<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="stylesheet" href="../../../shared/notion-theme.css" />
  <script src="../../../shared/notion-widget.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mô phỏng Chấm điểm Bù trừ (Compensatory Scoring) SAA-C03</title>
  <style>
    :root {
      --w-bg: #ffffff;
      --w-surface: #f8fafc;
      --w-border: #cbd5e1;
      --w-text: #0f172a;
      --w-muted: #475569;
      --w-accent: #2563eb;
      --w-pass: #059669;
      --w-pass-bg: #ecfdf5;
      --w-fail: #dc2626;
      --w-fail-bg: #fef2f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --w-bg: #191919;
        --w-surface: #222222;
        --w-border: #383838;
        --w-text: #f1f5f9;
        --w-muted: #94a3b8;
        --w-accent: #60a5fa;
        --w-pass: #34d399;
        --w-pass-bg: rgba(16, 185, 129, 0.16);
        --w-fail: #f87171;
        --w-fail-bg: rgba(239, 68, 68, 0.16);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--w-bg);
      color: var(--w-text);
      padding: 4px;
    }
    .sim-card {
      border: 1px solid var(--w-border);
      border-radius: 10px;
      background: var(--w-surface);
      padding: 10px 12px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .eyebrow {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--w-accent);
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .preset-btn {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid var(--w-border);
      background: var(--w-bg);
      color: var(--w-text);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .preset-btn:hover {
      border-color: var(--w-accent);
      color: var(--w-accent);
    }
    .grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 10px;
      align-items: stretch;
    }
    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; }
    }
    .sliders-box {
      background: var(--w-bg);
      border: 1px solid var(--w-border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .domain-row {
      display: grid;
      grid-template-columns: 122px 1fr 36px;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
    }
    .domain-name {
      font-weight: 600;
      white-space: nowrap;
    }
    .domain-weight {
      color: var(--w-muted);
      font-weight: 500;
      font-size: 10.5px;
    }
    .domain-val {
      text-align: right;
      font-weight: 700;
      color: var(--w-accent);
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      accent-color: var(--w-accent);
      cursor: pointer;
    }
    .result-box {
      background: var(--w-bg);
      border: 1px solid var(--w-border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .score-banner {
      padding: 6px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-banner.pass {
      background: var(--w-pass-bg);
      border: 1px solid var(--w-pass);
      color: var(--w-pass);
    }
    .score-banner.fail {
      background: var(--w-fail-bg);
      border: 1px solid var(--w-fail);
      color: var(--w-fail);
    }
    .score-num {
      font-size: 21px;
      font-weight: 800;
      line-height: 1;
    }
    .score-status {
      font-size: 11.5px;
      font-weight: 700;
    }
    .insight {
      font-size: 11.5px;
      color: var(--w-text);
      line-height: 1.4;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="sim-card">
    <div class="top-bar">
      <span class="eyebrow">🎛️ Mô phỏng điểm bù trừ (Kéo thanh trượt):</span>
      <div class="presets">
        <button class="preset-btn" type="button" onclick="applyPreset(85, 82, 75, 45)">Hụt D4 (45%) → Đậu</button>
        <button class="preset-btn" type="button" onclick="applyPreset(50, 58, 85, 90)">Hụt D1 & D2 → Trượt</button>
        <button class="preset-btn" type="button" onclick="applyPreset(75, 75, 75, 75)">Đều 75%</button>
      </div>
    </div>

    <div class="grid">
      <div class="sliders-box">
        <div class="domain-row">
          <span class="domain-name">D1 Security <span class="domain-weight">(30%)</span></span>
          <input type="range" id="d1" min="0" max="100" value="85" oninput="updateScore()" />
          <span class="domain-val" id="val1">85%</span>
        </div>
        <div class="domain-row">
          <span class="domain-name">D2 Resilient <span class="domain-weight">(26%)</span></span>
          <input type="range" id="d2" min="0" max="100" value="82" oninput="updateScore()" />
          <span class="domain-val" id="val2">82%</span>
        </div>
        <div class="domain-row">
          <span class="domain-name">D3 High-Perf <span class="domain-weight">(24%)</span></span>
          <input type="range" id="d3" min="0" max="100" value="75" oninput="updateScore()" />
          <span class="domain-val" id="val3">75%</span>
        </div>
        <div class="domain-row">
          <span class="domain-name">D4 Cost-Opt <span class="domain-weight">(20%)</span></span>
          <input type="range" id="d4" min="0" max="100" value="45" oninput="updateScore()" />
          <span class="domain-val" id="val4">45%</span>
        </div>
      </div>

      <div class="result-box">
        <div class="score-banner pass" id="banner">
          <div>
            <div class="score-status" id="statusText">ĐẠT (≥ 720)</div>
            <div style="font-size:10.5px; opacity:0.9;" id="correctCount">~37/50 câu (+15 unscored)</div>
          </div>
          <div class="score-num" id="scaledScore">764</div>
        </div>
        <div class="insight" id="insightText"></div>
      </div>
    </div>
  </div>

  <script>
    function applyPreset(v1, v2, v3, v4) {
      document.getElementById("d1").value = v1;
      document.getElementById("d2").value = v2;
      document.getElementById("d3").value = v3;
      document.getElementById("d4").value = v4;
      updateScore();
    }

    function updateScore() {
      const p1 = Number(document.getElementById("d1").value);
      const p2 = Number(document.getElementById("d2").value);
      const p3 = Number(document.getElementById("d3").value);
      const p4 = Number(document.getElementById("d4").value);

      document.getElementById("val1").textContent = p1 + "%";
      document.getElementById("val2").textContent = p2 + "%";
      document.getElementById("val3").textContent = p3 + "%";
      document.getElementById("val4").textContent = p4 + "%";

      const weightedPct = (p1 * 0.30) + (p2 * 0.26) + (p3 * 0.24) + (p4 * 0.20);
      const scaled = Math.round(100 + (weightedPct / 100) * 900);
      const approxCorrect = Math.round((weightedPct / 100) * 50);
      const passed = scaled >= 720;

      const banner = document.getElementById("banner");
      banner.className = "score-banner " + (passed ? "pass" : "fail");
      document.getElementById("scaledScore").textContent = scaled;
      document.getElementById("statusText").textContent = passed ? "ĐẠT (≥ 720)" : "CHƯA ĐẠT (< 720)";
      document.getElementById("correctCount").textContent = `~${approxCorrect}/50 câu (+15 unscored)`;

      const insight = document.getElementById("insightText");
      if (passed && (p1 < 65 || p2 < 65 || p3 < 65 || p4 < 65)) {
        insight.innerHTML = `💡 Dù D4 = ${p4}%, vẫn <b>ĐẬU (${scaled}/1000)</b> nhờ D1 & D2 trọng số lớn bù sang.`;
      } else if (!passed && (p3 >= 80 || p4 >= 80)) {
        insight.innerHTML = `⚠️ Dù D3/D4 cao nhưng hụt <b>D1 (30%) & D2 (26%)</b> khiến điểm tụt còn <b>${scaled}/1000</b>.`;
      } else {
        insight.innerHTML = `🎯 D1 + D2 đóng góp <b>${(p1*0.3 + p2*0.26).toFixed(1)}%</b> / tổng <b>${weightedPct.toFixed(1)}%</b> toàn bài (Mốc đậu: 720).`;
      }
    }

    updateScore();
  </script>
</body>
</html>
