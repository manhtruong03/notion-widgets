<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="stylesheet" href="../../../shared/notion-theme.css" />
  <script src="../../../shared/notion-widget.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mô phỏng Quyết định Chọn AWS Region (4 Trọng số)</title>
  <style>
    :root {
      --w-bg: #ffffff;
      --w-surface: #f8fafc;
      --w-border: #cbd5e1;
      --w-text: #0f172a;
      --w-muted: #475569;
      --w-accent: #2563eb;
      --w-ok: #059669;
      --w-ok-bg: #ecfdf5;
      --w-err: #dc2626;
      --w-err-bg: #fef2f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --w-bg: #191919;
        --w-surface: #222222;
        --w-border: #383838;
        --w-text: #f1f5f9;
        --w-muted: #94a3b8;
        --w-accent: #60a5fa;
        --w-ok: #34d399;
        --w-ok-bg: rgba(16, 185, 129, 0.16);
        --w-err: #f87171;
        --w-err-bg: rgba(239, 68, 68, 0.16);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--w-bg);
      color: var(--w-text);
      padding: 4px;
    }
    .card {
      border: 1px solid var(--w-border);
      border-radius: 10px;
      background: var(--w-surface);
      padding: 10px 12px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--w-accent);
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .p-btn {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 5px;
      border: 1px solid var(--w-border);
      background: var(--w-bg);
      color: var(--w-text);
      cursor: pointer;
    }
    .p-btn:hover, .p-btn.active {
      border-color: var(--w-accent);
      color: var(--w-accent);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 10px;
      align-items: stretch;
    }
    @media (max-width: 460px) {
      .grid { grid-template-columns: 1fr; }
    }
    .controls {
      background: var(--w-bg);
      border: 1px solid var(--w-border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .c-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }
    .c-label {
      font-weight: 600;
      white-space: nowrap;
    }
    select {
      width: 100%;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 5px;
      border: 1px solid var(--w-border);
      background: var(--w-surface);
      color: var(--w-text);
    }
    .results {
      background: var(--w-bg);
      border: 1px solid var(--w-border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    th, td {
      padding: 3px 5px;
      text-align: left;
      border-bottom: 1px solid var(--w-border);
    }
    th {
      color: var(--w-muted);
      font-weight: 600;
      font-size: 10px;
    }
    .tag-win {
      color: var(--w-ok);
      font-weight: 700;
    }
    .tag-out {
      color: var(--w-err);
      font-size: 10.5px;
    }
    .verdict {
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 5px;
      background: var(--w-ok-bg);
      border: 1px solid var(--w-ok);
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <span class="title">🧭 Mô phỏng 4 Trọng số Chọn Region:</span>
      <div class="presets">
        <button class="p-btn" type="button" onclick="setScenario('eu','eu','core','lat')">🏦 Ngân hàng Pháp (GDPR)</button>
        <button class="p-btn" type="button" onclick="setScenario('none','sea','core','lat')">🎮 Game ĐNÁ (Latency)</button>
        <button class="p-btn" type="button" onclick="setScenario('none','sea','new','lat')">🤖 Cần AI Mới (Preview)</button>
        <button class="p-btn" type="button" onclick="setScenario('none','sa','core','cost')">💰 Tối ưu Giá Batch</button>
      </div>
    </div>

    <div class="grid">
      <div class="controls">
        <div class="c-row">
          <span class="c-label">1. Compliance:</span>
          <select id="fComp" onchange="evaluateRegions()">
            <option value="none">Không khóa biên giới</option>
            <option value="eu" selected>Bắt buộc tại Pháp/EU</option>
            <option value="us">Bắt buộc tại Mỹ (US)</option>
          </select>
        </div>
        <div class="c-row">
          <span class="c-label">2. Khách hàng:</span>
          <select id="fProx" onchange="evaluateRegions()">
            <option value="eu" selected>Châu Âu (Pháp/Đức)</option>
            <option value="sea">Đông Nam Á (VN/Sing)</option>
            <option value="us">Bắc Mỹ (US East)</option>
            <option value="sa">Nam Mỹ (Brazil)</option>
          </select>
        </div>
        <div class="c-row">
          <span class="c-label">3. Dịch vụ cần:</span>
          <select id="fSvc" onchange="evaluateRegions()">
            <option value="core" selected>Dịch vụ chuẩn (EC2, S3)</option>
            <option value="new">Tính năng mới (Preview)</option>
          </select>
        </div>
        <div class="c-row">
          <span class="c-label">4. Ưu tiên:</span>
          <select id="fPrio" onchange="evaluateRegions()">
            <option value="lat" selected>⚡ Độ trễ thấp nhất</option>
            <option value="cost">💲 Chi phí rẻ nhất</option>
          </select>
        </div>
      </div>

      <div class="results">
        <table>
          <thead>
            <tr>
              <th>Region</th>
              <th>Độ trễ</th>
              <th>Giá</th>
              <th>Kết quả lọc</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="verdict" id="verdict"></div>
      </div>
    </div>
  </div>

  <script>
    const REGIONS = [
      { id: "us-east-1 (N.Virginia)", jur: "us", rtt: { us: 18, eu: 85, sea: 210, sa: 120 }, cost: "1.0x (Rẻ nhất)", preview: true },
      { id: "eu-west-3 (Paris)", jur: "eu", rtt: { us: 90, eu: 12, sea: 175, sa: 190 }, cost: "1.12x", preview: false },
      { id: "ap-southeast-1 (Sing)", jur: "apac", rtt: { us: 215, eu: 170, sea: 25, sa: 310 }, cost: "1.14x", preview: false },
      { id: "sa-east-1 (São Paulo)", jur: "sa", rtt: { us: 125, eu: 195, sea: 320, sa: 15 }, cost: "1.38x (Đắt)", preview: false }
    ];

    function setScenario(c, p, s, prio) {
      document.getElementById("fComp").value = c;
      document.getElementById("fProx").value = p;
      document.getElementById("fSvc").value = s;
      document.getElementById("fPrio").value = prio;
      evaluateRegions();
    }

    function evaluateRegions() {
      const comp = document.getElementById("fComp").value;
      const prox = document.getElementById("fProx").value;
      const svc = document.getElementById("fSvc").value;
      const prio = document.getElementById("fPrio").value;

      let best = null;
      let bestScore = Infinity;

      const rows = REGIONS.map(r => {
        const lat = r.rtt[prox];
        let reason = "";
        if (comp !== "none" && r.jur !== comp) {
          reason = "❌ Loại (Vi phạm luật)";
        } else if (svc === "new" && !r.preview) {
          reason = "❌ Loại (Chưa có dịch vụ)";
        } else {
          const score = prio === "lat" ? lat : (parseFloat(r.cost) * 100 + lat * 0.1);
          if (score < bestScore) {
            bestScore = score;
            best = r;
          }
        }
        return { r, lat, reason };
      });

      document.getElementById("tbody").innerHTML = rows.map(item => {
        const isWin = best && item.r.id === best.id;
        const statusHtml = item.reason
          ? `<span class="tag-out">${item.reason}</span>`
          : (isWin ? `<span class="tag-win">✅ Chọn tối ưu</span>` : `<span style="color:var(--w-muted)">Hợp lệ</span>`);
        return `
          <tr>
            <td><b>${item.r.id}</b></td>
            <td>${item.lat}ms</td>
            <td>${item.r.cost}</td>
            <td>${statusHtml}</td>
          </tr>
        `;
      }).join("");

      const v = document.getElementById("verdict");
      if (!best) {
        v.innerHTML = `⚠️ <b>Xung đột ràng buộc:</b> Region thỏa mãn luật nội địa chưa có dịch vụ Preview mới — cần đợi AWS mở dịch vụ hoặc dùng kiến trúc Hybrid.`;
      } else if (comp !== "none") {
        v.innerHTML = `🎯 <b>Chọn ${best.id}:</b> Ràng buộc <b>Compliance (Pháp lý)</b> luôn là bộ lọc cứng số 1, loại ngay các Region khác dù giá rẻ hơn.`;
      } else if (svc === "new") {
        v.innerHTML = `🎯 <b>Chọn ${best.id}:</b> Dịch vụ mới (Preview) chỉ vừa mở tại Region trọng điểm Mỹ; dùng thêm CloudFront để giảm trễ.`;
      } else if (prio === "cost") {
        v.innerHTML = `🎯 <b>Chọn ${best.id}:</b> Khi không vướng Compliance và không cần realtime, chọn Region có đơn giá hạ tầng thấp nhất (1.0x).`;
      } else {
        v.innerHTML = `🎯 <b>Chọn ${best.id}:</b> Gần người dùng cuối nhất (${best.rtt[prox]}ms RTT) và hỗ trợ đầy đủ các dịch vụ cốt lõi.`;
      }
    }

    evaluateRegions();
  </script>
</body>
</html>
