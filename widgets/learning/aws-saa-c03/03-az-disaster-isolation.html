<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mô phỏng Khám phá: Cô lập Thảm họa giữa các Availability Zones (Single-AZ vs. Multi-AZ)</title>
  <link rel="stylesheet" href="../../../shared/notion-theme.css" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --ok: #059669;
      --ok-soft: #ecfdf5;
      --err: #dc2626;
      --err-soft: #fef2f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --surface: #202020;
        --border: #2f2f2f;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --accent-soft: rgba(59, 130, 246, 0.15);
        --ok: #34d399;
        --ok-soft: rgba(16, 185, 129, 0.15);
        --err: #f87171;
        --err-soft: rgba(239, 68, 68, 0.15);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      line-height: 1.45;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      padding: 14px;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .label {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      margin-right: 4px;
    }
    .btn {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }
    .btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-disaster {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--err);
      background: var(--err-soft);
      color: var(--err);
      cursor: pointer;
    }
    .az-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    @media (max-width: 640px) {
      .az-grid { grid-template-columns: 1fr; }
    }
    .az-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .az-box.down {
      border-color: var(--err);
      background: var(--err-soft);
    }
    .az-box.healthy-active {
      border-color: var(--ok);
    }
    .az-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .badge {
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 700;
    }
    .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .badge.err { background: var(--err-soft); color: var(--err); }
    .badge.idle { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
    .dc-list {
      font-size: 11.5px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dc-item {
      padding: 4px 7px;
      border-radius: 5px;
      background: var(--surface);
      border: 1px dashed var(--border);
    }
    .outcome {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .outcome.ok {
      background: var(--ok-soft);
      border: 1px solid var(--ok);
      color: var(--text);
    }
    .outcome.err {
      background: var(--err-soft);
      border: 1px solid var(--err);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="controls">
      <div class="mode-group">
        <span class="label">🔬 Mô phỏng Region ap-southeast-2 (Sydney):</span>
        <button class="btn" id="btnSingle" type="button" onclick="setMode('single')">Triển khai Single-AZ (1 AZ)</button>
        <button class="btn active" id="btnMulti" type="button" onclick="setMode('multi')">Triển khai Multi-AZ (Chuẩn SAA-C03)</button>
      </div>
      <button class="btn-disaster" id="btnDisaster" type="button" onclick="toggleOutage()">⚡ Giả lập thảm họa mất điện tại AZ 2a</button>
    </div>

    <div class="az-grid" id="azGrid"></div>
    <div class="outcome ok" id="outcomeBox"></div>
  </div>

  <script>
    let mode = "multi";
    let outage = false;

    function setMode(m) {
      mode = m;
      document.getElementById("btnSingle").className = "btn" + (m === "single" ? " active" : "");
      document.getElementById("btnMulti").className = "btn" + (m === "multi" ? " active" : "");
      render();
    }

    function toggleOutage() {
      outage = !outage;
      document.getElementById("btnDisaster").textContent = outage
        ? "🔄 Khôi phục điện lưới AZ 2a (Reset)"
        : "⚡ Giả lập thảm họa mất điện tại AZ 2a";
      render();
    }

    function render() {
      const azs = [
        {
          name: "ap-southeast-2a",
          dcs: ["🏢 Data Center 2a-1 (App + DB Primary)", "🏢 Data Center 2a-2 (Cụm máy chủ phụ)"],
          active: true,
          failed: outage
        },
        {
          name: "ap-southeast-2b",
          dcs: ["🏢 Data Center 2b-1 (Điện/Mạng độc lập)", "🏢 Data Center 2b-2 (Cách biệt vật lý)"],
          active: mode === "multi",
          failed: false
        },
        {
          name: "ap-southeast-2c",
          dcs: ["🏢 Data Center 2c-1 (Điện/Mạng độc lập)"],
          active: mode === "multi",
          failed: false
        }
      ];

      document.getElementById("azGrid").innerHTML = azs.map(az => {
        const boxClass = az.failed ? "az-box down" : (az.active ? "az-box healthy-active" : "az-box");
        let badge = `<span class="badge idle">Không đặt tài nguyên</span>`;
        if (az.failed) badge = `<span class="badge err">❌ Mất kết nối toàn AZ</span>`;
        else if (az.active) badge = `<span class="badge ok">✅ Đang phục vụ Traffic</span>`;

        return `
          <div class="${boxClass}">
            <div class="az-head">
              <span>${az.name}</span>
              ${badge}
            </div>
            <div class="dc-list">
              ${az.dcs.map(d => `<div class="dc-item">${d}</div>`).join("")}
            </div>
          </div>
        `;
      }).join("");

      const out = document.getElementById("outcomeBox");
      if (!outage) {
        out.className = "outcome ok";
        out.innerHTML = mode === "multi"
          ? `<span>✅ <b>Trạng thái bình thường (Multi-AZ):</b> Các AZ nối với nhau qua cáp quang độ trễ cực thấp để đồng bộ dữ liệu thời gian thực. Hãy bấm <b>"Giả lập thảm họa mất điện tại AZ 2a"</b> để kiểm chứng.</span>`
          : `<span>⚠️ <b>Trạng thái bình thường (Single-AZ):</b> Dù AZ 2a có 2 tòa Data Center bên trong, cả hai vẫn nằm chung một vùng thảm họa. Hãy bấm <b>"Giả lập thảm họa"</b> để xem hậu quả.</span>`;
      } else if (mode === "single") {
        out.className = "outcome err";
        out.innerHTML = `<span>🚨 <b>SẬP TOÀN BỘ ỨNG DỤNG (Downtime 100%):</b> Vì bạn chỉ đặt tài nguyên ở <code>ap-southeast-2a</code> (Single-AZ), khi AZ này gặp thiên tai/mất điện diện rộng, không có AZ nào dự phòng nhận lưu lượng thay thế!</span>`;
      } else {
        out.className = "outcome ok";
        out.innerHTML = `<span>🛡️ <b>HỆ THỐNG VẪN SỐNG 100% (High Availability):</b> Sự cố bị cô lập hoàn toàn bên trong <code>ap-southeast-2a</code>. Lưu lượng tự động chuyển hướng sang <code>2b</code> và <code>2c</code> mà người dùng cuối không bị gián đoạn!</span>`;
      }
    }

    render();
  </script>
</body>
</html>
